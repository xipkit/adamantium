name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require a release commit from main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo '::error::The release commit must already be merged into main.'
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check the release tag against both crate versions
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          metadata = json.loads(subprocess.check_output([
              "cargo", "metadata", "--locked", "--no-deps", "--format-version", "1"
          ]))
          for name in ("adamantium", "cargo-adamantium"):
              package = next(p for p in metadata["packages"] if p["name"] == name)
              expected = "v" + package["version"]
              if os.environ["GITHUB_REF_NAME"] != expected:
                  raise SystemExit(f"{name} requires tag {expected}")
          PY
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo clippy --locked -p adamantium --all-targets --no-default-features -- -D warnings
      - run: cargo test --locked -p adamantium --no-default-features
      - run: cargo publish --locked --registry crates-io -p adamantium --all-features --dry-run
      - run: cargo publish --locked --registry crates-io -p cargo-adamantium --dry-run

  libraries:
    needs: verify
    uses: ./.github/workflows/deep-libraries.yml

  assets:
    needs: libraries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: deep-*
          merge-multiple: true
          path: deep
      - name: Attach both native libraries to the verified tag
        working-directory: deep
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=(adamantium-lints-linux-x86_64.so adamantium-lints-darwin-arm64.dylib)
          if existing=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'); then
            for asset in "${assets[@]}"; do
              if ! grep -Fqx "$asset" <<< "$existing"; then
                gh release upload "$GITHUB_REF_NAME" "$asset"
              fi
            done
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes "${assets[@]}"
          fi
      - name: Verify the public downloads against the build outputs
        working-directory: deep
        run: |
          for asset in adamantium-lints-linux-x86_64.so adamantium-lints-darwin-arm64.dylib; do
            curl --fail --location --proto '=https' --retry 3 --retry-all-errors \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$asset" -o "$RUNNER_TEMP/public-asset"
            cmp "$asset" "$RUNNER_TEMP/public-asset"
          done

  publish:
    needs: assets
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: [adamantium, cargo-adamantium]
    env:
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        if: matrix.package == 'cargo-adamantium'
        with:
          pattern: deep-*
          merge-multiple: true
          path: ${{ runner.temp }}/deep
      - name: Package the verified release pins in the CLI
        if: matrix.package == 'cargo-adamantium'
        run: |
          cp "$RUNNER_TEMP/deep/"{linux-x86_64,darwin-arm64}.json cli/src/deep/
          cargo package --locked --allow-dirty -p cargo-adamantium
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          args=()
          if [[ "$PACKAGE" == cargo-adamantium ]]; then args+=(--allow-dirty); fi
          cargo publish --locked --registry crates-io -p "$PACKAGE" "${args[@]}"
