name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: adamantium

  packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [adamantium, cargo-adamantium]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --locked --registry crates-io -p "${{ matrix.package }}" --all-features --dry-run

  rust:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.toolchain == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: ['1.96.0', stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
        if: matrix.toolchain == 'stable'
      - run: cargo clippy --version
        if: matrix.toolchain != '1.96.0'
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
        if: matrix.toolchain != '1.96.0'
      - run: cargo test --locked --workspace --all-features
      - run: cargo build --locked -p adamantium --no-default-features
      - run: cargo clippy --locked -p adamantium --all-targets --no-default-features -- -D warnings
        if: matrix.toolchain != '1.96.0'
      - run: cargo test --locked -p adamantium --no-default-features

  wasi:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: clippy
      - name: Install Wasmtime 48.0.2
        run: |
          archive=wasmtime-v48.0.2-x86_64-linux.tar.xz
          curl --fail --location --retry 3 "https://github.com/bytecodealliance/wasmtime/releases/download/v48.0.2/$archive" --output "$RUNNER_TEMP/$archive"
          echo "f2b0ad1ce9253f2f9a38793c2c42cd1cba4e90b27dc40d685eaf723dc8438d94  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasmtime-v48.0.2-x86_64-linux" >> "$GITHUB_PATH"
      - run: wasmtime --version
      - run: cargo clippy --locked --target wasm32-wasip1 -p adamantium -- -D warnings
      - run: cargo clippy --locked --target wasm32-wasip1 -p adamantium --no-default-features -- -D warnings
      - run: cargo test --locked --target wasm32-wasip1 -p adamantium --lib --tests
      - run: cargo test --locked --target wasm32-wasip1 -p adamantium --lib --tests --no-default-features
      - run: cargo test --locked --target wasm32-wasip1 -p adamantium --lib --tests --features serde,tracing

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test style/scripts/evaluate-decisions.test.mjs

  experimental-lints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install the opt-in lint toolchain
        run: |
          rustup toolchain install nightly-2026-08-20 --profile minimal --component rustc-dev,llvm-tools-preview,rustfmt
          cargo install --locked --version 6.4.0 cargo-dylint dylint-link
      - name: Build and exercise the experimental lints
        env:
          RUSTUP_TOOLCHAIN: stable
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo build --locked -p cargo-adamantium
          ./lints/build.sh
          cargo +nightly-2026-08-20 fmt --manifest-path lints/Cargo.toml -- --check
          library=$(find target/release -maxdepth 1 -name 'libadamantium_lints@*.so')
          test -n "$library"
          python3 lints/test.py --cli target/debug/cargo-adamantium --library "$library"
