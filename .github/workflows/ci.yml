name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.toolchain == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: ['1.88.0', stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
        if: matrix.toolchain == 'stable'
      - run: cargo clippy --version
        if: matrix.toolchain != '1.88.0'
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
        if: matrix.toolchain != '1.88.0'
      - run: cargo test --locked --workspace --all-features
      - run: cargo build --locked -p adamantium --no-default-features
      - run: cargo clippy --locked -p adamantium --all-targets --no-default-features -- -D warnings
        if: matrix.toolchain != '1.88.0'
      - run: cargo test --locked -p adamantium --no-default-features

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test style/scripts/evaluate-decisions.test.mjs

  experimental-lints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install the opt-in lint toolchain
        run: |
          rustup toolchain install nightly-2026-08-20 --profile minimal --component rustc-dev,llvm-tools-preview,rustfmt
          cargo install --locked --version 6.4.0 cargo-dylint dylint-link
      - name: Build and exercise the experimental lints
        env:
          RUSTUP_TOOLCHAIN: stable
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo build --locked -p cargo-adamantium
          ./lints/build.sh
          cargo +nightly-2026-08-20 fmt --manifest-path lints/Cargo.toml -- --check
          library=$(find target/release -maxdepth 1 -name 'libadamantium_lints@*.so')
          test -n "$library"
          python3 lints/test.py --cli target/debug/cargo-adamantium --library "$library"
