# Adamantium's Clippy configuration. `cargo adamantium check` applies it to a
# project together with the lint levels from `cargo adamantium rules`, and
# `cargo adamantium init` copies it into a project for plain `cargo clippy`.

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true

# Every external-crate entry has `allow-invalid`, because Clippy warns about each
# path it can't resolve in a crate the project uses, and most of these items
# exist only behind a crate feature the project may leave off. A test resolves
# every path with all of the crates' features on, so a misspelled path still
# fails it.

disallowed-types = [
  { path = "std::mem::ManuallyDrop", reason = "suppresses automatic cleanup and can leak; let values drop normally" },
  { path = "std::rc::Rc", reason = "shared identity; use a value, or adamantium::Actor for state that tasks share" },
  { path = "std::rc::Weak", reason = "weak references are outside Adamantium's ownership model" },
  { path = "std::sync::Weak", reason = "weak references are outside Adamantium's ownership model" },
  { path = "std::cell::RefCell", reason = "borrow checking at runtime panics; use a value" },
  { path = "std::cell::Cell", reason = "interior mutability without a lock; use a value" },
  { path = "std::sync::Mutex", reason = "use adamantium::Actor, which never holds its lock across an await or inside another actor" },
  { path = "std::sync::RwLock", reason = "use adamantium::Actor, which never holds its lock across an await or inside another actor" },
  { path = "tokio::sync::Mutex", reason = "an async lock can be held across an await; use adamantium::Actor", allow-invalid = true },
  { path = "tokio::sync::RwLock", reason = "an async lock can be held across an await; use adamantium::Actor", allow-invalid = true },
  { path = "tokio::sync::broadcast::Sender", reason = "drops messages for a receiver that falls behind. Use adamantium::Topic, which waits until every subscriber has room, or adamantium::Watch when only the latest value matters", allow-invalid = true },
  { path = "tokio::sync::broadcast::Receiver", reason = "drops messages for a receiver that falls behind. Use adamantium::Topic, which waits until every subscriber has room, or adamantium::Watch when only the latest value matters", allow-invalid = true },
  { path = "tokio::sync::oneshot::Sender", reason = "use adamantium::Reply for a modeled single reply", allow-invalid = true },
  { path = "tokio::sync::oneshot::Receiver", reason = "use adamantium::ReplyReceiver and call receive().await for an Option", allow-invalid = true },
  { path = "tokio::sync::watch::Sender", reason = "use adamantium::Watch for modeled latest-value state", allow-invalid = true },
  { path = "tokio::sync::watch::Receiver", reason = "use adamantium::Watcher to read cloned snapshots and wait for changes", allow-invalid = true },
  { path = "tokio::task::JoinSet", reason = "use adamantium::Tasks so every task has a scope that joins it", allow-invalid = true },
  { path = "tokio::task::LocalSet", reason = "every task must be Send", allow-invalid = true },
  { path = "parking_lot::Mutex", reason = "use adamantium::Actor", allow-invalid = true },
  { path = "parking_lot::RwLock", reason = "use adamantium::Actor", allow-invalid = true },
  { path = "futures::lock::Mutex", reason = "an async lock can be held across an await; use adamantium::Actor", allow-invalid = true },
]

disallowed-methods = [
  { path = "tokio::time::timeout", reason = "drops the future mid-await on expiry; use adamantium::Tasks::run_until with Cancellation and a deadline, or receive_until/send_until for channel operations", allow-invalid = true },
  { path = "std::vec::Vec::remove", reason = "panics on a bad index; use adamantium::Array::remove, which returns Option" },
  { path = "std::vec::Vec::insert", reason = "panics on a bad index; use adamantium::Array::insert, which returns Result" },
  { path = "std::vec::Vec::swap_remove", reason = "panics on a bad index; use adamantium::Array::remove, which returns Option and preserves order" },
  { path = "slice::split_at", reason = "panics on a bad index; use split_at_checked, which returns Option" },
  { path = "slice::copy_from_slice", reason = "panics on unequal lengths; return an error on a length mismatch, then copy with iter_mut().zip(source)" },
  { path = "std::sync::mpsc::channel", reason = "an unbounded channel has no backpressure; use adamantium::Channel" },
  { path = "std::sync::mpsc::sync_channel", reason = "sending or receiving can block a worker. Use adamantium::Channel::bounded(capacity).split() for async backpressure" },
  { path = "tokio::sync::mpsc::unbounded_channel", reason = "an unbounded channel has no backpressure; use adamantium::Channel", allow-invalid = true },
  { path = "async_channel::unbounded", reason = "an unbounded channel has no backpressure; use adamantium::Channel", allow-invalid = true },
  { path = "flume::unbounded", reason = "an unbounded channel has no backpressure; use adamantium::Channel", allow-invalid = true },
  { path = "crossbeam_channel::unbounded", reason = "an unbounded channel has no backpressure; use adamantium::Channel", allow-invalid = true },
  { path = "tokio::sync::broadcast::channel", reason = "drops messages for a receiver that falls behind. Use adamantium::Topic, which waits until every subscriber has room, or adamantium::Watch when only the latest value matters", allow-invalid = true },
  { path = "tokio::sync::oneshot::channel", reason = "use adamantium::Reply::pair for a modeled single reply", allow-invalid = true },
  { path = "tokio::sync::watch::channel", reason = "use adamantium::Watch::new and subscribe for modeled latest-value state", allow-invalid = true },
  { path = "tokio::spawn", reason = "an unstructured task; spawn inside adamantium::Tasks", allow-invalid = true },
  { path = "tokio::task::spawn", reason = "an unstructured task; spawn inside adamantium::Tasks", allow-invalid = true },
  { path = "tokio::task::spawn_local", reason = "every task must be Send; spawn inside adamantium::Tasks", allow-invalid = true },
  { path = "tokio::task::spawn_blocking", reason = "use adamantium::blocking, which propagates panics", allow-invalid = true },
  { path = "tokio::task::block_in_place", reason = "blocks a worker thread; use adamantium::blocking", allow-invalid = true },
  { path = "tokio::time::sleep", reason = "use adamantium::time::sleep so waits go through Adamantium's clock", allow-invalid = true },
  { path = "tokio::time::sleep_until", reason = "use adamantium::time::sleep_until so waits go through Adamantium's clock", allow-invalid = true },
  { path = "tokio::time::interval", reason = "use a loop over adamantium::time::sleep_until with deadlines from adamantium::time::now", allow-invalid = true },
  { path = "tokio::time::interval_at", reason = "use a loop over adamantium::time::sleep_until with deadlines from adamantium::time::now", allow-invalid = true },
  { path = "tokio::time::Instant::now", reason = "build deadlines from adamantium::time::now; std::time::Instant::now is allowed for measuring elapsed time", allow-invalid = true },
  # A runtime's own entry points start the same tasks as the functions above.
  # `Runtime::block_on` is left out: `#[tokio::main]` and `#[tokio::test]`
  # expand to it, and it is how a program without them enters the runtime.
  # Tokio panics if it is called from inside a runtime.
  { path = "tokio::runtime::Handle::spawn", reason = "an unstructured task; spawn inside adamantium::Tasks", allow-invalid = true },
  { path = "tokio::runtime::Handle::spawn_blocking", reason = "use adamantium::blocking, which propagates panics", allow-invalid = true },
  { path = "tokio::runtime::Handle::block_on", reason = "blocks the calling thread; await the future", allow-invalid = true },
  { path = "tokio::runtime::Runtime::spawn", reason = "an unstructured task; spawn inside adamantium::Tasks", allow-invalid = true },
  { path = "tokio::runtime::Runtime::spawn_blocking", reason = "use adamantium::blocking, which propagates panics", allow-invalid = true },
  { path = "tokio::runtime::LocalRuntime::spawn_local", reason = "every task must be Send; spawn inside adamantium::Tasks", allow-invalid = true },
  { path = "tokio::runtime::LocalRuntime::spawn_blocking", reason = "use adamantium::blocking, which propagates panics", allow-invalid = true },
  { path = "tokio::runtime::LocalRuntime::block_on", reason = "every task must be Send; use #[tokio::main] or Runtime::block_on", allow-invalid = true },
  # `task::Builder` exists only with `--cfg tokio_unstable` and Tokio's
  # `tracing` feature.
  { path = "tokio::task::Builder::spawn", reason = "an unstructured task; spawn inside adamantium::Tasks", allow-invalid = true },
  { path = "tokio::task::Builder::spawn_on", reason = "an unstructured task; spawn inside adamantium::Tasks", allow-invalid = true },
  { path = "tokio::task::Builder::spawn_local", reason = "every task must be Send; spawn inside adamantium::Tasks", allow-invalid = true },
  { path = "tokio::task::Builder::spawn_local_on", reason = "every task must be Send; spawn inside adamantium::Tasks", allow-invalid = true },
  { path = "tokio::task::Builder::spawn_blocking", reason = "use adamantium::blocking, which propagates panics", allow-invalid = true },
  { path = "tokio::task::Builder::spawn_blocking_on", reason = "use adamantium::blocking, which propagates panics", allow-invalid = true },
  { path = "async_std::task::spawn", reason = "an unstructured task; spawn inside adamantium::Tasks", allow-invalid = true },
  { path = "async_std::task::spawn_local", reason = "every task must be Send; spawn inside adamantium::Tasks", allow-invalid = true },
  { path = "async_std::task::spawn_blocking", reason = "use adamantium::blocking, which propagates panics", allow-invalid = true },
  { path = "async_std::task::Builder::spawn", reason = "an unstructured task; spawn inside adamantium::Tasks", allow-invalid = true },
  { path = "async_std::task::Builder::local", reason = "every task must be Send; spawn inside adamantium::Tasks", allow-invalid = true },
  { path = "smol::spawn", reason = "an unstructured task; spawn inside adamantium::Tasks", allow-invalid = true },
  { path = "smol::Executor::spawn", reason = "an unstructured task; spawn inside adamantium::Tasks", allow-invalid = true },
  { path = "smol::Executor::spawn_many", reason = "unstructured tasks; spawn inside adamantium::Tasks", allow-invalid = true },
  { path = "smol::LocalExecutor::spawn", reason = "every task must be Send; spawn inside adamantium::Tasks", allow-invalid = true },
  { path = "smol::LocalExecutor::spawn_many", reason = "every task must be Send; spawn inside adamantium::Tasks", allow-invalid = true },
  { path = "smol::unblock", reason = "use adamantium::blocking, which propagates panics", allow-invalid = true },
  # A `thread_local!` value is reached only through these methods. Banning the
  # macro itself would need a crate-level allow for the library's own uses.
  { path = "std::thread::LocalKey::with", reason = "a thread-local belongs to an OS thread, and a task can move to another thread at any await; pass the value in, or share it through adamantium::Actor" },
  { path = "std::thread::LocalKey::try_with", reason = "a thread-local belongs to an OS thread, and a task can move to another thread at any await; pass the value in, or share it through adamantium::Actor" },
  { path = "std::thread::LocalKey::get", reason = "a thread-local belongs to an OS thread, and a task can move to another thread at any await; pass the value in, or share it through adamantium::Actor" },
  { path = "std::thread::LocalKey::set", reason = "a thread-local belongs to an OS thread, and a task can move to another thread at any await; pass the value in, or share it through adamantium::Actor" },
  { path = "std::thread::LocalKey::take", reason = "a thread-local belongs to an OS thread, and a task can move to another thread at any await; pass the value in, or share it through adamantium::Actor" },
  { path = "std::thread::LocalKey::replace", reason = "a thread-local belongs to an OS thread, and a task can move to another thread at any await; pass the value in, or share it through adamantium::Actor" },
  { path = "std::thread::LocalKey::with_borrow", reason = "a thread-local belongs to an OS thread, and a task can move to another thread at any await; pass the value in, or share it through adamantium::Actor" },
  { path = "std::thread::LocalKey::with_borrow_mut", reason = "a thread-local belongs to an OS thread, and a task can move to another thread at any await; pass the value in, or share it through adamantium::Actor" },
  { path = "std::thread::spawn", reason = "an unstructured thread; use adamantium::Tasks or adamantium::blocking" },
  { path = "std::thread::Builder::spawn", reason = "an unstructured thread; use adamantium::Tasks or adamantium::blocking" },
  { path = "std::thread::scope", reason = "blocks the async runtime; use adamantium::blocking" },
  { path = "std::thread::sleep", reason = "blocks a worker thread; use adamantium::time::sleep" },
  { path = "std::process::abort", reason = "skips every scope's cleanup; return an exit code from main" },
  { path = "std::mem::forget", reason = "leaks" },
  { path = "std::boxed::Box::leak", reason = "leaks" },
  { path = "std::sync::Arc::downgrade", reason = "weak references are outside Adamantium's ownership model" },
  { path = "futures::executor::block_on", reason = "blocks a worker thread", allow-invalid = true },
]
