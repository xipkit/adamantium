[package]
name = "cargo-adamantium"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Checks that a crate stays inside the adamantium fragment of Rust"
repository.workspace = true
license.workspace = true
readme.workspace = true
publish.workspace = true
include = [
    "src/**",
    "tests/**",
    "clippy.toml",
    "clippy-strict.toml",
    "CHANGELOG.md",
    "README.md",
    "LICENSE",
]

[[bin]]
name = "cargo-adamantium"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fastrand = "2"
globset = "0.4"
httpdate = "1"
ignore = "0.4"
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
quote = { version = "1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "unbounded_depth"] }
serde_stacker = "0.1"
sha2 = "0.11"
syn = { version = "3", default-features = false, features = ["clone-impls", "full", "parsing", "printing", "visit", "visit-mut"] }
tempfile = "3"
toml_edit = "0.25"
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
adamantium = { path = ".." }
jsonschema = { version = "0.61", default-features = false }

[lints]
workspace = true
