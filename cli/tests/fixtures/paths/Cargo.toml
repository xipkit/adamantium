# Uses each crate that Adamantium's `clippy.toml` names, so Clippy resolves the
# paths in it. The tests choose the crates' features with `--features`. Its own
# workspace, so Cargo does not look for a parent.
[workspace]

[package]
name = "paths"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
async-channel = { version = "2", optional = true }
async-std = { version = "1", optional = true }
crossbeam-channel = { version = "0.5", optional = true }
fastrand = { version = "2", default-features = false, optional = true }
flume = { version = "0.12", optional = true }
futures = { version = "0.3", optional = true }
parking_lot = { version = "0.12", optional = true }
rand_08 = { package = "rand", version = "0.8", default-features = false, optional = true }
rand_09 = { package = "rand", version = "0.9", default-features = false, optional = true }
rand = { version = "0.10", default-features = false, optional = true }
smol = { version = "2", optional = true }
tokio = { version = "1", default-features = false, optional = true }
