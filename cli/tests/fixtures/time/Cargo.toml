# Clock entry points beside Adamantium's wrappers. Each line that must be
# reported ends in `// disallowed`. Its own workspace, so Cargo does not look
# for a parent.
[workspace]

[package]
name = "time"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
adamantium = { path = "../../../.." }
tokio = { version = "1", features = ["time"] }

[profile.release]
overflow-checks = true
