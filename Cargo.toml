[workspace]
members = ["cli"]
exclude = [
    "lints",
    "lints/fixtures",
    "cli/tests/fixtures/violations",
    "cli/tests/fixtures/clean",
    "cli/tests/fixtures/workspace",
    "cli/tests/fixtures/skips",
    "cli/tests/fixtures/runtime",
    "cli/tests/fixtures/spawns",
    "cli/tests/fixtures/unstable",
    "cli/tests/fixtures/paths",
    "cli/tests/fixtures/indexing",
    "cli/tests/fixtures/channels",
    "cli/tests/fixtures/strict",
    "cli/tests/fixtures/time",
    "cli/tests/fixtures/random",
    "cli/tests/fixtures/deps",
    "cli/tests/fixtures/sync",
    "cli/tests/fixtures/state",
    "cli/tests/fixtures/cancellation",
    "cli/tests/fixtures/select",
    "cli/tests/fixtures/macros",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.96"
repository = "https://github.com/xipkit/adamantium"
license = "MIT"
readme = "README.md"
publish = ["crates-io"]

# Adamantium's own rules, applied to this repository. `cargo adamantium rules`
# prints the same table, and a test keeps the two in step.
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
dbg_macro = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
exit = "deny"
expect_used = "deny"
future_not_send = "deny"
indexing_slicing = "deny"
let_underscore_future = "deny"
let_underscore_must_use = "deny"
mem_forget = "deny"
panic = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

# Optional additions listed by `cargo adamantium rules --strict`. These are
# metadata so the repository itself continues to use the default tier.
[workspace.metadata.adamantium-strict.lints.clippy]
arithmetic_side_effects = "deny"

[package]
name = "adamantium"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Copy-on-write values, structured concurrency and actors for Rust, with the lint set that keeps a crate inside them"
repository.workspace = true
license.workspace = true
readme.workspace = true
publish.workspace = true
include = [
    "src/**",
    "tests/**",
    "examples/**",
    "benches/**/*.rs",
    "docs/migrating.md",
    "CHANGELOG.md",
    "README.md",
    "LICENSE",
    "assets/adamantium-mark.svg",
]

[features]
default = ["tokio"]
tokio = ["dep:tokio", "dep:async-stream", "dep:futures-core"]
signal = ["tokio", "tokio/signal"]
serde = ["dep:serde", "indexmap/serde"]
deterministic = ["tokio", "tokio/io-util", "dep:shuttle", "dep:shuttle-engine", "dep:shuttle-std", "dep:shuttle-schedulers", "dep:serde", "dep:serde_json"]
tracing = ["dep:tracing"]

[dependencies]
concurrent-queue = "2"
event-listener = "5"
async-stream = { version = "0.3", optional = true }
futures-core = { version = "0.3", optional = true }
indexmap = "2"
pin-project-lite = "0.2"
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
# Replay artifacts identify these versions; keep the engine's components pinned too.
shuttle = { version = "=0.9.10", optional = true }
shuttle-engine = { version = "=0.1.8", optional = true }
shuttle-std = { version = "=0.1.5", optional = true }
shuttle-schedulers = { version = "=0.1.1", optional = true }
tokio = { version = "1.47", features = ["macros", "rt", "sync", "time"], optional = true }
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
cbor4ii = { version = "1", features = ["serde1", "use_alloc"] }
criterion = { version = "0.5", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
im = "=15.1.0"
serde_json = "1"
serde_yaml = "0.9"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "fmt"] }

[target.'cfg(not(target_os = "wasi"))'.dev-dependencies]
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time", "test-util"] }

# Tokio builds for WASI with only these features: one thread, no sockets and
# no paused clock.
[target.'cfg(target_os = "wasi")'.dev-dependencies]
tokio = { version = "1.47", features = ["io-util", "macros", "rt", "sync", "time"] }

[[bench]]
name = "cow"
harness = false

[[example]]
name = "streaming"
required-features = ["tokio"]

[[example]]
name = "discovery"
required-features = ["tokio"]

[[example]]
name = "task_diagnostics"
required-features = ["tokio", "tracing"]

[[example]]
name = "async_actor"
required-features = ["tokio"]

[[example]]
name = "server"
required-features = ["tokio", "signal"]

[profile.release]
overflow-checks = true

[lints]
workspace = true

[[bench]]
name = "channel"
harness = false
required-features = ["tokio"]
